<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Interview | InterviewAI</title>

    <link rel="stylesheet" href="assets/css/interview-type.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<section class="interview-type">

    <h1>Choose Your Interview</h1>

    <p>
        Select the interview type you want to practice with AI.
    </p>

    <div class="card-container">

        <div class="card">

            <i class="fa-solid fa-users"></i>

            <h2>HR Interview</h2>

            <ul>

                <li>Behavioral Questions</li>

                <li>Communication Skills</li>

                <li>Confidence Assessment</li>

                <li>HR Scenarios</li>

            </ul>

            <button class="select-btn"
onclick="window.location.href='difficulty.html'">

    Select

</button>

        </div>

        <div class="card">

            <i class="fa-solid fa-laptop-code"></i>

            <h2>Technical Interview</h2>

            <ul>

                <li>DSA Questions</li>

                <li>Core Subjects</li>

                <li>Programming</li>

                <li>Problem Solving</li>

            </ul>

            <button class="select-btn"
onclick="window.location.href='difficulty.html'">

    Select

</button>

        </div>

    </div>

</section>

<script src="assets/js/interview-type.js"></script>

</body>

</html>
