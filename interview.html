<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Interview | InterviewAI</title>

    <link rel="stylesheet" href="assets/css/interview.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="interview-container">

    <div class="top-bar">

        <h2>InterviewAI</h2>

        <div class="timer">

            <i class="fa-regular fa-clock"></i>

            <span id="timer">05:00</span>

        </div>

    </div>

    <div class="question-box">

        <h3 id="questionNumber">Question 1 of 10</h3>

        <h2 id="questionText">
    Tell me about yourself.
</h2>

<button id="replayQuestionBtn">
    🔊 Replay Question
</button>

    </div>

    <div class="camera-box">

    <video
        id="cameraVideo"
        autoplay
        playsinline
        muted>
    </video>

    <canvas
        id="cameraCanvas">
    </canvas>

</div>
    <div class="answer-section">

    <h3>Your Answer</h3>

    <textarea
        id="answerText"
        placeholder="Your spoken answer will appear here..."
        rows="6"
    ></textarea>

</div>

    <div class="status">

        <div>

            🎤 Microphone : Active

        </div>

        <div>

            📹 Camera : Active

        </div>

    </div>

    <div class="buttons">

        <button id="recordBtn">

            Start Recording

        </button>

        <button id="nextBtn">

            Next Question

        </button>

        <button id="endBtn">

            End Interview

        </button>

    </div>

</div>


<script src="assets/js/interview.js"></script>



</body>

</html>
