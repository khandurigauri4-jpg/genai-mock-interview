<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | InterviewAI</title>

    <link rel="stylesheet" href="assets/css/profile.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="profile-container">

    <!-- ==============================
         PROFILE CARD
    ============================== -->

    <div class="profile-card">

        <div class="profile-image">
            <i class="fa-solid fa-user"></i>
        </div>

        <!-- Name will now come from MongoDB -->
        <h1 id="profileName">Loading...</h1>

        <!-- Email will now come from MongoDB -->
        <p class="email" id="profileEmail">Loading...</p>

        <button id="editProfile">
            Edit Profile
        </button>

    </div>


    <!-- ==============================
         PROFILE DETAILS
    ============================== -->

    <div class="profile-details">

        <h2>Personal Information</h2>

        <div class="info-grid">

            <!-- COLLEGE -->

            <div class="info-box">

                <h4>College</h4>

                <p id="college">
                    Loading...
                </p>

            </div>


            <!-- DEGREE -->

            <div class="info-box">

                <h4>Degree</h4>

                <p id="degree">
                    Loading...
                </p>

            </div>


            <!-- YEAR -->

            <div class="info-box">

                <h4>Year</h4>

                <p id="year">
                    Loading...
                </p>

            </div>


            <!-- LOCATION -->

            <div class="info-box">

                <h4>Location</h4>

                <p id="location">
                    Loading...
                </p>

            </div>

        </div>


        <!-- ==============================
             INTERVIEW SUMMARY
        ============================== -->

        <h2>Interview Summary</h2>

        <div class="summary-grid">

            <div class="summary-card">

                <h3>12</h3>

                <p>
                    Interviews Taken
                </p>

            </div>


            <div class="summary-card">

                <h3>87%</h3>

                <p>
                    Average Score
                </p>

            </div>


            <div class="summary-card">

                <h3>82</h3>

                <p>
                    ATS Score
                </p>

            </div>


            <div class="summary-card">

                <h3>8</h3>

                <p>
                    Badges Earned
                </p>

            </div>

        </div>


        <!-- ==============================
             DASHBOARD BUTTON
        ============================== -->

        <button id="dashboardBtn">

            Back to Dashboard

        </button>

    </div>

</div>


<!-- PROFILE JAVASCRIPT -->

<script src="assets/js/profile.js"></script>

</body>

</html>
